name: MoonBit CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit toolchain version
        run: moon version --all
      - name: Check warnings
        run: moon check --deny-warn
      - name: Run tests
        run: moon test
      - name: Run native tests
        run: moon test --target native
      - name: Verify public interface
        run: |
          moon info
          git diff --exit-code
      - name: Validate published package contents
        shell: bash
        run: |
          files="$(moon package --list)"
          printf '%s\n' "$files"
          if grep -Fq 'arachne_项目申报书.md' <<<"$files"; then
            echo "The contest application must not be included in the library package."
            exit 1
          fi
      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code
